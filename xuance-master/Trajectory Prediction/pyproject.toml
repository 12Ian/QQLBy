[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "civilian-trajectory-prediction"
version = "0.4.0"
description = "Supervised civilian 3D trajectory and measured-neighbor forecasting research module"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "torch>=2.7,<3", "scipy>=1.11,<2",
                "gymnasium>=0.29,<2", "PyYAML>=6,<7", "cloudpickle>=3,<4",
                "tqdm>=4.67,<5", "opencv-python-headless>=4.10,<4.12",
                "matplotlib==3.10.6", "contourpy>=1.2,<1.4"]

[project.scripts]
trajectory-prediction = "trajectory_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
