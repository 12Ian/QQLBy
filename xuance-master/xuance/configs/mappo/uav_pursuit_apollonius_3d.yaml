agent: "MAPPO"
env_name: "uav_pursuit_apollonius_3d"
env_id: "apollonius_3d"
env_seed: 1
continuous_action: True
learner: "MAPPO_Clip_Learner"
policy: "Gaussian_MAAC_Policy"
representation: "Basic_MLP"
vectorize: "SubprocVecMultiAgentEnv"
runner: "MARL"

# ---- 3D environment params (same as the MADDPG method; GAT off for a clean baseline) ----
num_agents: 6
z_min: 50.0
z_max: 350.0
episode_length: 400
escape_num_dirs: 200
curriculum_enabled: True
criterion_mode: euclidean
use_graph_module: False
use_obstacle_gat: False
obstacle_gat_k: 4
obstacle_gat_feat_dim: 4
obstacle_gat_hidden: 32
obstacle_gat_heads: 2

use_rnn: False
rnn: "GRU"
fc_hidden_sizes: [256, 256]
recurrent_hidden_size: 64
N_recurrent_layers: 1
dropout: 0
normalize: "LayerNorm"
initialize: "orthogonal"
gain: 0.01
representation_hidden_size: [256, ]
actor_hidden_size: [512, 512]
critic_hidden_size: [512, 512]
activation: "leaky_relu"
activation_action: "tanh"
use_parameter_sharing: True
use_actions_mask: False

seed: 1
parallels: 16
buffer_size: 3200
n_epochs: 10
n_minibatch: 4
learning_rate: 0.0005
weight_decay: 0
vf_coef: 0.5
ent_coef: 0.01
target_kl: 0.25
clip_range: 0.2
clip_type: 1
gamma: 0.99

use_linear_lr_decay: False
end_factor_lr_decay: 0.5
use_global_state: False
use_value_clip: True
value_clip_range: 0.2
use_value_norm: True
use_huber_loss: True
huber_delta: 10.0
use_advnorm: True
use_gae: True
gae_lambda: 0.95
use_grad_clip: True
grad_clip_norm: 10.0

running_steps: 5000000
eval_interval: 250000
test_episode: 20
log_dir: "logs/mappo/"
model_dir: "models/mappo/"
