agent: "MATD3"
env_name: "uav_pursuit_apollonius_3d"
env_id: "apollonius_3d"
env_seed: 1
continuous_action: True
learner: "MATD3_Learner"
policy: "MATD3_Policy"
representation: "Basic_Identical"
vectorize: "SubprocVecMultiAgentEnv"
runner: "MARL"

# ---- 3D environment params (same as the MADDPG method; GAT off for a clean baseline) ----
num_agents: 6
z_min: 50.0
z_max: 350.0
episode_length: 400
escape_num_dirs: 200
curriculum_enabled: True
criterion_mode: euclidean
use_graph_module: False
use_obstacle_gat: False
obstacle_gat_k: 4
obstacle_gat_feat_dim: 4
obstacle_gat_hidden: 32
obstacle_gat_heads: 2

representation_hidden_size: []
actor_hidden_size: [512, 512]
critic_hidden_size: [512, 512]
activation: 'leaky_relu'
activation_action: 'tanh'
use_parameter_sharing: True
use_actions_mask: False

seed: 1
parallels: 16
buffer_size: 1000000
batch_size: 1024
learning_rate_actor: 0.0001
learning_rate_critic: 0.001
gamma: 0.99
tau: 0.001
actor_update_delay: 2
start_noise: 1.0
end_noise: 0.01
sigma: 0.1
start_training: 1000
running_steps: 5000000
training_frequency: 25
use_grad_clip: True
grad_clip_norm: 0.5
eval_interval: 250000
test_episode: 20
log_dir: "logs/matd3/"
model_dir: "models/matd3/"
