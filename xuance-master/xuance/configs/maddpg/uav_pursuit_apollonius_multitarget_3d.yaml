agent: "MADDPG"
env_name: "uav_pursuit_apollonius_multitarget_3d"
env_id: "apollonius_mt_3d"
env_seed: 1
continuous_action: True
learner: "MADDPG_Learner"
policy: "MADDPG_Policy"
representation: "Basic_Identical"
vectorize: "SubprocVecMultiAgentEnv"
runner: "MARL"

# ---- multi-target 3D environment params ----
num_agents: 6
num_targets: 2
z_min: 50.0
z_max: 350.0
episode_length: 400
escape_num_dirs: 200
curriculum_enabled: True
criterion_mode: euclidean

representation_hidden_size: []
actor_hidden_size: [512, 512]
critic_hidden_size: [512, 512]
activation: 'leaky_relu'
activation_action: 'tanh'
use_parameter_sharing: True
use_actions_mask: False

use_graph_module: False
graph_hidden_dim: 128
graph_alpha: 0.2
use_obstacle_gat: False
obstacle_gat_k: 4
obstacle_gat_feat_dim: 4
obstacle_gat_hidden: 32
obstacle_gat_heads: 2

render: false
seed: 1
parallels: 16
buffer_size: 1000000
batch_size: 1024
learning_rate_actor: 0.0001
learning_rate_critic: 0.001
gamma: 0.99
tau: 0.001
start_noise: 1.0
end_noise: 0.01
sigma: 0.1
start_training: 10
running_steps: 5000000
training_frequency: 25
use_grad_clip: True
grad_clip_norm: 0.5

eval_interval: 250000
test_episode: 20
log_dir: "logs/maddpg/"
model_dir: "models/maddpg/"
