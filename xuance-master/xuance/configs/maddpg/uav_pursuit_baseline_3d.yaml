# Fixed uniform maps; sparse capture + dense distance and obstacle avoidance.
agent: MADDPG
env_name: uav_pursuit_coverage_3d
env_id: coverage_3d
env_seed: 1
continuous_action: true
learner: MADDPG_Learner
policy: MADDPG_Policy
representation: Basic_Identical
vectorize: SubprocVecMultiAgentEnv
runner: MARL
num_agents: 4
z_min: 50.0
z_max: 350.0
uav_initial_speed: 1.0
uav_max_speed: 11.0
max_accel: 3.0
acceleration_lag: 0.5
uav_jerk_max: 6.0
target_jerk_max: 8.0
target_velocity_response: 1.0
target_min_speed: 3.0
target_max_speed: 5.0
target_accel: 1.0
decision_dt: 1.0
physics_dt: 0.1
episode_length: 400
capture_radius: 15.0
direct_intercept_radius: 5.0
capture_hold_required: 2.0
escape_num_dirs: 200
use_nearest_building_obs: true
nearest_building_k: 5
use_target_prediction_obs: false
future_prediction_steps: 5
preparation_time_scale: 12.0
closure_time_scale: 30.0
match_distance: 40.0
match_distance_width: 10.0
match_speed_scale: 3.0
building_mode: uniform_20
spawn_offset: 100.0
randomize_building_layout: false
curriculum_enabled: true
curriculum_auto_advance_by_steps: false
curriculum_min_steps_per_level: 100000
curriculum_max_level: 4
criterion_mode: euclidean
spawn_safety_enabled: true
spawn_safety_margin: 1.5
spawn_search_resolution: 1.0
spawn_vertical_radius: 70.0
spawn_boundary_margin: 30.0
evader_center_pull: 1.5
evader_sense: 60.0
w_prep: 15.0
w_cov: 4.0
w_close: 60.0
w_match: 8.0
w_hold: 1.0
w_step: 0.1
w_safe: 1.0
w_terminal: 240.0
w_direct_terminal: 300.0
building_collision_penalty: 80.0
boundary_collision_penalty: 100.0
uav_collision_penalty: 80.0
collision_contact_penalty_per_second: 20.0
boundary_warning_distance: 30.0
terminate_on_boundary_collision: false
uav_collision_enabled: true
separation_weight: 0.5
separation_distance: 20.0
terminate_on_collision: false
terminate_on_building_collision: false
representation_hidden_size: []
actor_hidden_size:
- 512
- 512
critic_hidden_size:
- 512
- 512
activation: leaky_relu
activation_action: tanh
use_parameter_sharing: true
use_actions_mask: false
render: false
seed: 1
parallels: 16
buffer_size: 1000000
batch_size: 1024
learning_rate_actor: 0.0001
learning_rate_critic: 0.0003
gamma: 0.99
tau: 0.001
start_noise: 1.0
end_noise: 0.01
sigma: 0.1
start_training: 1024
running_steps: 10000000
training_frequency: 1
use_graph_module: false
graph_hidden_dim: 128
graph_alpha: 0.2
use_obstacle_gat: false
obstacle_gat_k: 5
obstacle_gat_feat_dim: 6
obstacle_gat_hidden: 32
obstacle_gat_heads: 2
use_grad_clip: true
grad_clip_norm: 0.5
eval_interval: 50000
test_episode: 100
baseline_eval_parallels: 8
log_dir: outputs/logs/maddpg/
model_dir: outputs/models/maddpg/
reward_mode: baseline
curriculum_context_obs: true
curriculum_success_threshold: 0.8
curriculum_collision_threshold: 0.1
curriculum_required_passes: 2
curriculum_start_level: 0
curriculum_eval_all_levels: false
